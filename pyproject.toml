[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payments-ledger-reconciliation"
version = "0.1.0"
description = "Double-entry payments ledger with idempotent webhook ingestion and three-way reconciliation"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "SQLAlchemy>=2.0",
    "psycopg2-binary",
    "pandas",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
ledger = "ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
