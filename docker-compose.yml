# Run:  cp .env.example .env   (edit the passwords)   then   docker compose up -d
#
# STATUS: the Python code and SQL were tested against a real PostgreSQL 16. These
# Compose definitions follow standard patterns but were NOT run in the sandbox where
# the project was built (no Docker daemon was available there). If something fails,
# `docker compose logs <service>` is the first place to look.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data      # named volume: data survives container restarts
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy            # wait until Postgres actually accepts connections
    env_file: .env
    environment:
      POSTGRES_HOST: postgres                 # inside Compose, the service name is the hostname
    ports:
      - "8000:8000"
    # Apply migrations (idempotent), then start the server.
    command: sh -c "python -m ledger migrate && uvicorn ledger.ingest.webhook_app:app --host 0.0.0.0 --port 8000"

  # Optional: Airflow. Start with   docker compose --profile airflow up -d
  # Uses the official image in 'standalone' mode (single container, for local learning only).
  airflow:
    profiles: ["airflow"]
    image: apache/airflow:2.10.5
    depends_on:
      postgres:
        condition: service_healthy
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      PYTHONPATH: /opt/airflow/project/src
      SETTLEMENT_DIR: /opt/airflow/data/settlement
      REPORT_DIR: /opt/airflow/data/reports
      DBT_PROJECT_DIR: /opt/airflow/project/dbt
      _PIP_ADDITIONAL_REQUIREMENTS: "SQLAlchemy>=2.0 psycopg2-binary pandas python-dotenv dbt-postgres"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/project/src
      - ./dbt:/opt/airflow/project/dbt
      - ./data:/opt/airflow/data
    ports:
      - "8080:8080"
    command: standalone

volumes:
  pgdata:
